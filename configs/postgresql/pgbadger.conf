# Включить сборщик логов
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_truncate_on_rotation = off
log_rotation_age = 1d
log_rotation_size = 100MB


log_destination = 'stderr'


log_line_prefix = '%t [%p]: user=%u,db=%d,app=%a,client=%h '


log_min_duration_statement = 500ms


log_checkpoints = on
log_connections = 'receipt,setup_durations'
log_disconnections = on
log_lock_waits = on
log_temp_files = 0            # логировать ВСЕ временные файлы
log_autovacuum_min_duration = 0
log_error_verbosity = default

# shared_preload_libraries требует restart (не reload!)
shared_preload_libraries = 'pg_stat_statements, auto_explain'

# pg_stat_statements
pg_stat_statements.track = all
pg_stat_statements.max = 10000
pg_stat_statements.save = on

# auto_explain — логировать планы "медленных" запросов
auto_explain.log_min_duration = 1000ms   # например, >1 сек
auto_explain.log_analyze = on
auto_explain.log_buffers = on
auto_explain.log_format = json            # удобнее для парсинга